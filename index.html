<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="build" content="ca9dca2d">
  <meta name="theme-color" content="#060a18">
  <title>Cranial Combat: Trivia Showdown</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Russo+One&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=ca9dca2d">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="stage" id="stage"><div id="app"></div></main>

  <!-- PeerJS (WebRTC) provides the peer-to-peer connection. Version is pinned. -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <!-- Plain scripts (no modules). Order matters: each file uses globals from the ones before it. -->
  <script src="js/build.js?v=ca9dca2d"></script>
  <script src="js/config.js?v=ca9dca2d"></script>
  <script src="js/api.js?v=ca9dca2d"></script>
  <script src="js/filter.js?v=ca9dca2d"></script>
  <script src="js/game.js?v=ca9dca2d"></script>
  <script src="js/net.js?v=ca9dca2d"></script>
  <script src="js/ui.js?v=ca9dca2d"></script>
  <script src="js/main.js?v=ca9dca2d"></script>

  <!-- Startup check. Lives in the page itself so it still runs when a cached script is old or missing. -->
  <script>
    (function () {
      var box = document.getElementById("app");
      var style = "padding:16px;margin:16px;border:2px solid #ff7a1a;background:#10162c;color:#eaf2ff;font:600 16px/1.4 system-ui,sans-serif;border-radius:6px";

      function stop(text) {
        box.innerHTML = '<div style="' + style + '"><p style="margin:0 0 12px">' + text + '</p>' +
          '<button type="button" id="reload" style="font:inherit;padding:10px 18px;cursor:pointer;min-height:44px">Reload</button></div>';
        document.getElementById("reload").onclick = function () { location.reload(); };
      }

      var missing = [];
      if (typeof Peer === "undefined") missing.push("Peer");
      if (typeof BUILD === "undefined") missing.push("BUILD");
      if (typeof CONFIG === "undefined") missing.push("CONFIG");
      if (typeof Api === "undefined") missing.push("Api");
      if (typeof Filter === "undefined") missing.push("Filter");
      if (typeof HostGame === "undefined") missing.push("HostGame");
      if (typeof Net === "undefined") missing.push("Net");
      if (typeof UI === "undefined") missing.push("UI");
      if (typeof App === "undefined") missing.push("App");

      var meta = document.querySelector('meta[name="build"]');
      var stale = typeof BUILD !== "undefined" && meta && meta.content !== BUILD;

      if (missing.length || stale) {
        var internet = missing.length === 1 && missing[0] === "Peer";
        stop(internet
          ? "The connection library didn't load. Check your internet connection, then reload."
          : "Some game files didn't load. This is usually an out-of-date cached copy. Press Ctrl+F5 (Cmd+Shift+R on a Mac) or tap Reload.");
        if (window.console) console.warn("Startup check failed. Missing: " + missing.join(", ") + (stale ? " Build mismatch." : ""));
        return;
      }

      // Anything unexpected later shows up on screen rather than silently doing nothing.
      var banner = null;
      function report(text) {
        if (banner) return;
        banner = document.createElement("div");
        banner.setAttribute("role", "alert");
        banner.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99;" + style + ";margin:8px";
        banner.innerHTML = "Something went wrong: " + String(text).replace(/[<>&]/g, "") +
          ' <button type="button" style="font:inherit;margin-left:8px;padding:6px 12px;cursor:pointer;min-height:44px">Reload</button>';
        banner.querySelector("button").onclick = function () { location.reload(); };
        document.body.appendChild(banner);
      }
      window.addEventListener("error", function (e) { report(e.message || "unexpected error"); });
      window.addEventListener("unhandledrejection", function (e) { report((e.reason && e.reason.message) || e.reason || "unexpected error"); });

      App.start();
    })();
  </script>
</body>
</html>
